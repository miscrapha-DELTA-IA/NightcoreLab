name: Backend Unit Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Run offline unit tests
        run: python -m unittest discover -s backend -p 'test_*.py'
