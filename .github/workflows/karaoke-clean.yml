name: Karaoke Clean Mode Tests

on:
  pull_request:
    paths:
      - 'NightcoreLab/Sources/LyricsControlCenter.swift'
      - 'NightcoreLab/Sources/LyricsView.swift'
      - 'NightcoreLab/Sources/KaraokeLyricsView.swift'
      - 'NightcoreLab/Sources/NowPlayingScreen.swift'
      - 'NightcoreLab/Sources/ContentView.swift'
      - 'NightcoreLabTests/KaraokeCleanModeTests.swift'
      - '.github/workflows/karaoke-clean.yml'

jobs:
  karaoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test clean presentation and existing lyrics contracts
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -only-testing:NightcoreLabTests/KaraokeCleanModeTests \
            -only-testing:NightcoreLabTests/LyricsMatchingTests \
            -only-testing:NightcoreLabTests/NowPlayingScreenTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log

      - name: Resumo de falhas como anotações
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os
          path = 'xcodebuild-test.log'
          lines = open(path, errors='replace').read().splitlines() if os.path.exists(path) else []
          pattern = re.compile(r"(error:|fatal error|Test Case .* failed|XCTAssert|Testing failed|crashed|unexpected exit|TEST FAILED|TEST EXECUTE FAILED)")
          hits, seen = [], set()
          for line in lines:
              line = line.strip()
              if pattern.search(line) and line not in seen:
                  seen.add(line); hits.append(line)
          if not hits:
              hits = [l.strip() for l in lines[-40:]]
          def esc(x): return x.replace('%', '%25').replace('\r', '')[:500]
          for i in range(0, min(len(hits), 90), 9):
              print("::error title=xcodebuild::" + "%0A".join(esc(x) for x in hits[i:i+9]))
          PY
