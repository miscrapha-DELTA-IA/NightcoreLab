name: Playback Foundation Backend Regression

on:
  pull_request:
    branches: [main, stage-16a-discovery-engine]
    paths:
      - 'NightcoreLab/Sources/**'
      - 'NightcoreLabTests/**'
      - 'backend/**'
      - '.github/workflows/playback-backend-regression.yml'
  workflow_dispatch:

jobs:
  python-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Run all backend unit tests (no live YouTube required)
        run: python -m unittest discover -s backend -p 'test_*.py' -v
