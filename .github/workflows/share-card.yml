name: Share Card iOS Tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'NightcoreLab/Sources/Share/**'
      - 'NightcoreLab/Sources/NowPlayingScreen.swift'
      - 'NightcoreLab/Sources/TurbulentMarbleView.swift'
      - 'NightcoreLabTests/ShareSnapshotTests.swift'
      - '.github/workflows/share-card.yml'

jobs:
  test-share:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test frozen Marble and image sharing on simulator
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath ShareCard.xcresult \
            -only-testing:NightcoreLabTests/ShareSnapshotTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log

      - name: Resumo de falhas como anotações
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os
          path = 'xcodebuild-test.log'
          lines = open(path, errors='replace').read().splitlines() if os.path.exists(path) else []
          pattern = re.compile(r"(error:|fatal error|Test Case .* failed|XCTAssert|Testing failed|crashed|unexpected exit|TEST FAILED|TEST EXECUTE FAILED)")
          hits, seen = [], set()
          for line in lines:
              line = line.strip()
              if pattern.search(line) and line not in seen:
                  seen.add(line); hits.append(line)
          if not hits:
              hits = [l.strip() for l in lines[-40:]]
          def esc(x): return x.replace('%', '%25').replace('\r', '')[:500]
          for i in range(0, min(len(hits), 90), 9):
              print("::error title=xcodebuild::" + "%0A".join(esc(x) for x in hits[i:i+9]))
          PY

      - name: Save visual catalog for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ShareCard-Visual-Tests
          path: ShareCard.xcresult
          if-no-files-found: ignore
          retention-days: 7
