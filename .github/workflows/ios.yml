name: Build Unsigned IPA (Free Route)

on:
  workflow_dispatch:
  # Full simulator test suite on every PR (Stage 10A proposal): the other PR
  # workflows only build or run subsets.
  pull_request:
    # Stacked Stage 17A PRs also need the complete XCTest/Release/IPA gate.
    branches: [ "main", "stage-16a-discovery-engine", "stage-17-spotifast-playback-foundation", "stage-17b-search-persistence-robustness", "stage-17c-ios-remote-transport", "stage-17d-karaoke-smoothness", "stage-18a-performance-pad-engine", "stage-18a2-source-clip-pad", "stage-18a3-fingerdrum-latency-profiling" ]
  push:
    branches: [ "main" ]
    # Mudanças só no servidor Python (e no teste dele) não recompilam o app iOS
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/backend-smoke.yml'

# Stop obsolete jobs only for the *same* PR. Never cancel another PR's gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # "[skip ios]" na mensagem do commit pula o build e economiza minutos de macOS.
    if: ${{ !contains(github.event.head_commit.message, '[skip ios]') }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar Projeto
        run: xcodegen generate

      - name: Resolver dependências SPM
        run: xcodebuild -resolvePackageDependencies -project NightcoreLab.xcodeproj -scheme NightcoreLab

      - name: Measure MaterialResolver time and allocation calls
        run: |
          set -o pipefail
          bash scripts/material-benchmark/run.sh | tee material-benchmark.json

      - name: Save material benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaterialResolver-Benchmark
          path: material-benchmark.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar busca, cache e qualidade de áudio no simulador
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath AudioQuality.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log

      - name: Resumo de falhas como anotações
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os
          path = 'xcodebuild-test.log'
          lines = open(path, errors='replace').read().splitlines() if os.path.exists(path) else []
          pattern = re.compile(r"(error:|fatal error|Test Case .* failed|XCTAssert|Testing failed|crashed|unexpected exit|TEST FAILED|TEST EXECUTE FAILED)")
          hits, seen = [], set()
          for line in lines:
              line = line.strip()
              if pattern.search(line) and line not in seen:
                  seen.add(line); hits.append(line)
          if not hits:
              hits = [l.strip() for l in lines[-40:]]
          def esc(x): return x.replace('%', '%25').replace('\r', '')[:500]
          for i in range(0, min(len(hits), 90), 9):
              print("::error title=xcodebuild::" + "%0A".join(esc(x) for x in hits[i:i+9]))
          PY

      - name: Guardar resultados dos testes de áudio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioQuality-Tests
          path: AudioQuality.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Compilar App sem Assinatura
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar em arquivo .ipa
        run: |
          test -d build/Release-iphoneos/NightcoreLab.app || { echo "NightcoreLab.app não encontrado"; ls -R build | head -50; exit 1; }
          mkdir -p Payload
          mv build/Release-iphoneos/NightcoreLab.app Payload/
          zip -qry NightcoreLab_Unsigned.ipa Payload

      - name: Disponibilizar Download
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreLab-App
          path: NightcoreLab_Unsigned.ipa
          retention-days: 7

