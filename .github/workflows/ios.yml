name: Build Unsigned IPA (Free Route)

# Exploration is chosen from the SOURCE branch (head_ref for PRs, ref_name for
# pushes), never from the PR's target. Manual dispatch intentionally opts into
# full validation even on exploration branches.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - '*-experiments*'
      - 'exp/**'
      - '*-final*'
      - 'release/**'
    # Mudanças só no servidor Python (e no teste dele) não recompilam o app iOS
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/backend-smoke.yml'

# Cancel superseded pushes to the same branch and commits on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  neural-model:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'stage-20b-vocal-fx-loops-experiments') || (!(startsWith(github.head_ref || github.ref_name, 'exp/') || contains(github.head_ref || github.ref_name, '-experiments')) && (github.ref_name == 'main' || contains(github.ref_name, '-final') || startsWith(github.ref_name, 'release/') || (github.event_name == 'pull_request' && (github.base_ref == 'main' || contains(github.base_ref, '-final') || startsWith(github.base_ref, 'release/') || contains(github.head_ref, '-final') || startsWith(github.head_ref, 'release/')))))) && !contains(github.event.head_commit.message, '[skip ios]') }}
    uses: ./.github/workflows/neural-stems.yml

  fast-check:
    name: Fast Check — compile, smoke suites and visual contract
    if: >-
      ${{ github.event_name != 'workflow_dispatch' && (startsWith(github.head_ref || github.ref_name, 'exp/') || contains(github.head_ref || github.ref_name, '-experiments')) }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for testing (no full test execution)
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          echo "FAST_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcodebuild \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/NightcoreFastDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Run smoke suites and fast visual catalog contract
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$FAST_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/NightcoreFastDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:NightcoreLabTests/RuntimeStabilizationTests \
            -only-testing:NightcoreLabTests/AudioQualityTests \
            -only-testing:NightcoreLabTests/VisualMaterialEngineTests/testLegacyMaterialCatalogPrefixAndExpandedTypes \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

  build:
    name: build
    needs: neural-model
    env:
      TEST_RUNNER_GNARLY_REQUIRE_NEURAL_MODEL: "1"
    # Manual dispatch can force the entire delivery gate on any branch.
    # Explicit Stage 20B.1 recovery push also runs the full iPhoneOS IPA gate,
    # rather than hiding it behind the exploration-only fast lane.
    # Remove this one-branch recovery opt-in after PR #70 is merged.
    # Release/final PRs and pushes to main retain the original pipeline.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'stage-20b-vocal-fx-loops-experiments') || (!(startsWith(github.head_ref || github.ref_name, 'exp/') || contains(github.head_ref || github.ref_name, '-experiments')) && (github.ref_name == 'main' || contains(github.ref_name, '-final') || startsWith(github.ref_name, 'release/') || (github.event_name == 'pull_request' && (github.base_ref == 'main' || contains(github.base_ref, '-final') || startsWith(github.base_ref, 'release/') || contains(github.head_ref, '-final') || startsWith(github.head_ref, 'release/')))))) && !contains(github.event.head_commit.message, '[skip ios]') }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/download-artifact@v4
        with:
          name: Gnarly-Neural-Model
          path: NightcoreLab/Resources/NeuralStems

      - name: Require verified on-device separation model
        run: |
          test -f NightcoreLab/Resources/NeuralStems/htdemucs_staged/pipeline.json
          python3 -c 'import json; p=json.load(open("NightcoreLab/Resources/NeuralStems/neural-parity.json")); assert p["passed"] and len(p["sources"]) == 4'

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar Projeto
        run: xcodegen generate

      - name: Resolver dependências SPM
        run: xcodebuild -resolvePackageDependencies -project NightcoreLab.xcodeproj -scheme NightcoreLab

      - name: Measure MaterialResolver time and allocation calls
        run: |
          set -o pipefail
          bash scripts/material-benchmark/run.sh | tee material-benchmark.json

      - name: Save material benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaterialResolver-Benchmark
          path: material-benchmark.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Neural stems runtime, resampling and independent mixer regressions
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath NeuralStems.xcresult \
            -only-testing:NightcoreLabTests/NeuralStemsRegressionTests \
            -only-testing:NightcoreLabTests/DemucsDSPTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee neural-stems-test.log

      - name: Save neural runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Neural-Stems-iOS-Tests
          path: |
            neural-stems-test.log
            NeuralStems.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Stage 40 GPU regression gate: run the 14 historically red tests FIRST.
      # No exclusions/relaxations: the unfiltered full XCTest job runs immediately
      # afterwards, and Release IPA remains gated on both test passes.
      - name: Stage 40 targeted Metal render and preview/export parity regressions
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath Stage40-Targeted.xcresult \
            -only-testing:NightcoreLabTests/AdaptiveCompositionLayoutTests/testPortraitOriginalPixelParity \
            -only-testing:NightcoreLabTests/AdaptiveCompositionLayoutTests/testSquareAndLandscapePreviewExportExactPixelsAndViewport \
            -only-testing:NightcoreLabTests/CompositionRuntimeTests/testExistingStoryFrameRendererReceivesCompatibleValues \
            -only-testing:NightcoreLabTests/CreativeMarbleRenderingTests/testMetalFrameRasterSizesUnchangedWhenReactive \
            -only-testing:NightcoreLabTests/CreatorControlTests/testControlledPreviewAndExportUseIdenticalFrame \
            -only-testing:NightcoreLabTests/PlayerBackgroundStyleTests/testStage40ExportUsesEveryLivePaletteAndNativeResolution \
            -only-testing:NightcoreLabTests/ShareExportPipelineTests/testDefaultPortraitPreviewAndEncoderShareExactPixels \
            -only-testing:NightcoreLabTests/ShareExportPipelineTests/testFourLyricModelsFreezeIntoShareAndRenderDistinctStoryFrames \
            -only-testing:NightcoreLabTests/ShareExportPipelineTests/testSharedCanvasRendersThreeRatiosWithoutChangingSceneSource \
            -only-testing:NightcoreLabTests/ShareExportPipelineTests/testSharePackageContainsValidatedVideoThumbnailAndMetadata \
            -only-testing:NightcoreLabTests/ShareExportPipelineTests/testStage40RealMetalContrastPaletteAndContinuousFrames \
            -only-testing:NightcoreLabTests/StoryRenderTimelineTests/testExportFrameUsesSameVisualSceneAsScrubPreview \
            -only-testing:NightcoreLabTests/StoryRenderTimelineTests/testStage37ConsecutiveThirtyFPSFramesHaveLinearPhaseAndDistinctPixels \
            -only-testing:NightcoreLabTests/StoryRenderTimelineTests/testThreeBeatAndSectionFramesMatchPreviewAndEncoderState \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee stage40-targeted-test.log

      - name: Save targeted Stage 40 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage40-Targeted-Tests
          path: |
            stage40-targeted-test.log
            Stage40-Targeted.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar busca, cache e qualidade de áudio no simulador
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath AudioQuality.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log

      - name: Collect compact visual and test evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('xcodebuild-test.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          selected = [line for line in lines if any(marker in line for marker in (
              'Stage40 pixels:', 'error:', 'Test Suite ', 'Executed ',
              'testStage40', 'TEST SUCCEEDED', 'TEST FAILED'))]
          Path('stage40-validation.txt').write_text('\n'.join(selected) + '\n')
          PYCODE

      - name: Save visual and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage40-Validation
          path: stage40-validation.txt
          retention-days: 7

      - name: Resumo de falhas como anotações
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os
          path = 'xcodebuild-test.log'
          lines = open(path, errors='replace').read().splitlines() if os.path.exists(path) else []
          pattern = re.compile(r"(error:|fatal error|Test Case .* failed|XCTAssert|Testing failed|crashed|unexpected exit|TEST FAILED|TEST EXECUTE FAILED)")
          hits, seen = [], set()
          for line in lines:
              line = line.strip()
              if pattern.search(line) and line not in seen:
                  seen.add(line); hits.append(line)
          if not hits:
              hits = [l.strip() for l in lines[-40:]]
          def esc(x): return x.replace('%', '%25').replace('\r', '')[:500]
          for i in range(0, min(len(hits), 90), 9):
              print("::error title=xcodebuild::" + "%0A".join(esc(x) for x in hits[i:i+9]))
          PY

      - name: Guardar resultados dos testes de áudio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioQuality-Tests
          path: AudioQuality.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Compilar App sem Assinatura
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar em arquivo .ipa
        run: |
          test -d build/Release-iphoneos/NightcoreLab.app || { echo "NightcoreLab.app não encontrado"; ls -R build | head -50; exit 1; }
          mkdir -p Payload
          mv build/Release-iphoneos/NightcoreLab.app Payload/
          zip -qry NightcoreLab_Unsigned.ipa Payload

      - name: Disponibilizar Download
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreLab-App
          path: NightcoreLab_Unsigned.ipa
          retention-days: 7

