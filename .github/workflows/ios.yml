name: Build Unsigned IPA (Free Route)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Mudanças só no servidor Python (e no teste dele) não recompilam o app iOS
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/backend-smoke.yml'

jobs:
  build:
    # "[skip ios]" na mensagem do commit pula o build e economiza minutos de macOS.
    if: ${{ !contains(github.event.head_commit.message, '[skip ios]') }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar Projeto
        run: xcodegen generate

      - name: Compilar App sem Assinatura
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar em arquivo .ipa
        run: |
          test -d build/Release-iphoneos/NightcoreLab.app || { echo "NightcoreLab.app não encontrado"; ls -R build | head -50; exit 1; }
          mkdir -p Payload
          mv build/Release-iphoneos/NightcoreLab.app Payload/
          zip -qry NightcoreLab_Unsigned.ipa Payload

      - name: Disponibilizar Download
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreLab-App
          path: NightcoreLab_Unsigned.ipa
          retention-days: 7
