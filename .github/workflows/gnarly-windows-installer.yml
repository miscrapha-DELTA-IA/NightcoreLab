name: Gnarly Windows Installer
on:
  push:
    branches: [distribution/gnarly-windows-installer]
    paths: [windows-installer/**, .github/workflows/gnarly-windows-installer.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gnarly-windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows-installer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-installer/src-tauri -> target
      - name: Prepare Windows native build dependencies
        run: choco install strawberryperl make --no-progress -y
      - name: Install pinned frontend dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build interface
        run: bun run build
      - name: Generate Gnarly desktop icons
        run: bun tauri icon public/gnarly.svg
      - name: Verify real published IPA for native integrity tests
        shell: pwsh
        run: |
          $ipa = Join-Path $env:RUNNER_TEMP 'Gnarly-57-Continuity.ipa'
          Invoke-WebRequest 'https://github.com/miscrapha-DELTA-IA/NightcoreLab/releases/download/gnarly-build57-livecontainer-beta/Gnarly-57-Continuity.ipa' -OutFile $ipa
          if ((Get-Item $ipa).Length -ne 112107110) { throw 'Wrong IPA size' }
          if ((Get-FileHash $ipa -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a12387c7bd3d361c8dd3eeb78ad090559e0e0c24111f15ef0c03e3a8f6440dc9') { throw 'Wrong IPA digest' }
          "GNARLY_IPA_TEST=$ipa" | Out-File $env:GITHUB_ENV -Append
      - name: Test verified and truncated IPA handling
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib gnarly::tests
      - name: Build Windows installer
        run: bun tauri build --bundles nsis -- --locked
      - name: Assemble delivery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item $setup[0].FullName delivery/Gnarly-Installer-Windows-x64-Setup.exe
          Copy-Item README.md delivery/LEIA-ME.md
          Copy-Item LICENSE,LICENSE-BRANDING,UPSTREAM.md delivery/
          $hash = (Get-FileHash delivery/Gnarly-Installer-Windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Gnarly-Installer-Windows-x64-Setup.exe" | Set-Content delivery/SHA256SUMS.txt
          Compress-Archive -Path delivery/* -DestinationPath Gnarly-Installer-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gnarly-Installer-Windows-x64
          if-no-files-found: error
          path: |
            windows-installer/delivery/*
            windows-installer/Gnarly-Installer-Windows-x64.zip
      - name: Publish isolated Windows beta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const tag = 'gnarly-windows-installer-v0.1.0-beta';
            const root = 'windows-installer/';
            const setup = fs.readFileSync(root + 'delivery/Gnarly-Installer-Windows-x64-Setup.exe');
            const checksum = crypto.createHash('sha256').update(setup).digest('hex');
            if (!fs.readFileSync(root + 'delivery/SHA256SUMS.txt', 'utf8').includes(checksum)) throw new Error('Setup checksum mismatch');
            let existing;
            try { existing = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            if (existing) throw new Error('Beta tag already exists. Use a new installer version for a new publication.');
            const body = 'Primeira beta do instalador Windows x64 para o Gnarly build 57.\n\nConecte o iPhone por USB, entre na conta Apple do dono do aparelho, confirme a seleção e clique em Instalar / renovar Gnarly. O IPA é baixado, verificado por SHA-256 e reutilizado. A assinatura gratuita continua exigindo renovação em até 7 dias.\n\nInterface e compilação nativa verificadas no Windows em CI; instalação por USB ainda precisa de validação física. O instalador Windows não tem certificado comercial de assinatura. Derivado independente do iloader (MIT), sem afiliação ao autor original.\n\nFonte: ' + context.sha + '\nCI: https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
              target_commitish: context.sha, name: 'Gnarly Installer · Windows x64 · beta 0.1',
              body, draft: true, prerelease: true, make_latest: 'false'})).data;
            for (const [name, path] of [
              ['Gnarly-Installer-Windows-x64-Setup.exe', 'delivery/Gnarly-Installer-Windows-x64-Setup.exe'],
              ['Gnarly-Installer-Windows-x64.zip', 'Gnarly-Installer-Windows-x64.zip'],
              ['LEIA-ME.md', 'delivery/LEIA-ME.md'],
              ['SHA256SUMS.txt', 'delivery/SHA256SUMS.txt']]) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync(root + path)});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, tag_name: tag, draft: false, prerelease: true, make_latest: 'false'});
            core.info('Published: https://github.com/' + owner + '/' + repo + '/releases/tag/' + tag);
