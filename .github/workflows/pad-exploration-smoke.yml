name: Pad Exploration Smoke

on:
  push:
    branches: [stage-18a-pad-latency-experiments]
    paths:
      - 'NightcoreLab/Sources/Performance/PadAudioRuntime.swift'
      - 'NightcoreLab/Sources/Performance/PadPerformanceModels.swift'
      - 'NightcoreLab/Sources/Performance/PerformanceModeView.swift'
      - 'NightcoreLab/Sources/AudioEngineManager.swift'
      - 'NightcoreLabTests/AudioQualityTests.swift'
      - '.github/workflows/pad-exploration-smoke.yml'

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile and run ONE pad allocation smoke test
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -only-testing:NightcoreLabTests/AudioQualityTests/testExplorationVoiceOverlapChokeAndFastHitVariation \
            CODE_SIGNING_ALLOWED=NO
