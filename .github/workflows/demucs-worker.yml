name: Demucs Dev Worker Tests

on:
  push:
    paths:
      - 'backend/stems_dev.py'
      - 'backend/demucs_app.py'
      - 'backend/test_demucs_app.py'
      - 'scripts/dev-stems/start-demucs-windows.ps1'
      - '.github/workflows/demucs-worker.yml'
  pull_request:
    paths:
      - 'backend/stems_dev.py'
      - 'backend/demucs_app.py'
      - 'backend/test_demucs_app.py'
      - 'scripts/dev-stems/start-demucs-windows.ps1'
      - '.github/workflows/demucs-worker.yml'

permissions:
  contents: read

jobs:
  worker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated API test dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'uvicorn>=0.29,<1'
      - name: Validate Python syntax and isolated worker contracts
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile backend/stems_dev.py backend/demucs_app.py backend/test_demucs_app.py
          python -m unittest discover -s backend -p 'test_demucs_app.py' -v
