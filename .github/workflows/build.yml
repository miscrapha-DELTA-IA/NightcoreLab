name: iOS Build

permissions:
  contents: read

# Só valida pull requests: pushes na main já são compilados pelo ios.yml.
# (Em repositório privado, cada minuto de macOS conta como 10 da cota gratuita.)
on:
  pull_request:
    paths-ignore:
      - 'backend/**'
  workflow_dispatch:

# Stop obsolete jobs only for the *same* PR. Never cancel another PR's gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # No duplicate compile for experiment heads: ios.yml owns Fast Check.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || !(startsWith(github.head_ref || github.ref_name, 'exp/') || contains(github.head_ref || github.ref_name, '-experiments')) }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Selecionar Xcode estável
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar NightcoreLab.xcodeproj
        run: xcodegen generate

      - name: Resolver pacotes SPM
        run: xcodebuild -resolvePackageDependencies -project NightcoreLab.xcodeproj -scheme NightcoreLab

      - name: Compilar para o simulador (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
