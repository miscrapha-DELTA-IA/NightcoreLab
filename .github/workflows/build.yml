name: iOS Build

# Só valida pull requests: pushes na main já são compilados pelo ios.yml.
# (Em repositório privado, cada minuto de macOS conta como 10 da cota gratuita.)
on:
  pull_request:
    paths-ignore:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode estável
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar NightcoreLab.xcodeproj
        run: xcodegen generate

      - name: Resolver pacotes SPM
        run: xcodebuild -resolvePackageDependencies -project NightcoreLab.xcodeproj -scheme NightcoreLab

      - name: Compilar para o simulador (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validar ponte Fosfora, audio-reactive e regressões
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NightcoreLab.xcodeproj \
            -scheme NightcoreLab \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -only-testing:NightcoreLabTests/FosforaAudioVisualBridgeTests \
            -only-testing:NightcoreLabTests/AudioVisualMapperTests \
            -only-testing:NightcoreLabTests/AudioFeaturesTests \
            -only-testing:NightcoreLabTests/KaraokeTypographyTests \
            CODE_SIGNING_ALLOWED=NO
