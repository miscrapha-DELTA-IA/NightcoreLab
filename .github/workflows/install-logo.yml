name: Install NightcoreLab logo
on:
  push:
    branches: [main]
    paths:
      - '.logo-staging/**'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert user SVG to app assets
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          parts = sorted(Path('.logo-staging').glob('part-*.txt'))
          assert len(parts) == 12
          svg = ''.join(p.read_text(encoding='utf8') for p in parts)
          assert svg.startswith('<svg') and svg.rstrip().endswith('</svg>')
          assets = Path('NightcoreLab/Resources/Assets.xcassets')
          logo = assets/'NightcoreLogo.imageset'
          logo.mkdir(exist_ok=True)
          (logo/'Contents.json').write_text('{"images":[{"filename":"NightcoreLogo.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}')
          png = cairosvg.svg2png(bytestring=svg.encode(), output_width=1024, output_height=1024)
          (logo/'NightcoreLogo.png').write_bytes(png)
          (assets/'AppIcon.appiconset/AppIcon-1024.png').write_bytes(png)
          Path('branding').mkdir(exist_ok=True)
          Path('branding/NightcoreLab-logo.svg').write_text(svg,encoding='utf8')
          for p in parts: p.unlink()
          Path('.logo-staging').rmdir()
          PY
      - name: Commit icon and brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: replace app icon and header logo from supplied SVG"
          git push origin HEAD:main
